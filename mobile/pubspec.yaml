name: fixflow_mobile
description: FixFlow technician companion
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  uuid: ^4.5.0
  flutter_secure_storage: ^9.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true

dependency_overrides:
  # Keep the Android storage plugin on the pre-JNI implementation so local
  # builds do not require an NDK for this app's simple file-path support.
  path_provider_android: 2.2.23
