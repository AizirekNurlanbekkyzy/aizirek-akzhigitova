services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fixflow}
      POSTGRES_USER: ${POSTGRES_USER:-fixflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fixflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fixflow}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fixflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fixflow}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports: ["${BACKEND_PORT:-8000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10
  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
